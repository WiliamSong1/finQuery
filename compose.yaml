
services:
  finquery:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: finquery-api

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    environment:
      ENVIRONMENT: production
      QDRANT_PATH: /app/data/qdrant
      HF_HOME: /app/model_cache

    volumes:
      - finquery_data:/app/data
      - finquery_models:/app/model_cache

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  finquery_data:
  finquery_models:
